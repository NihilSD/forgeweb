name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  REQUIRE_DOCKER: '1'
  RUNNER_RUNTIME: runc
  RUNNER_REDIS_URL: redis://localhost:6379/4
  DATABASE_URL: postgresql://forge:forge@localhost:5432/forge_test
  E2E_DATABASE_URL: postgresql://forge:forge@localhost:5432/forge_e2e
  REDIS_URL: redis://localhost:6379/1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v5
      - name: Generate throwaway secrets for this run
        # Never commit secret-shaped values, even test ones: fresh random keys per run.
        run: |
          {
            echo "APP_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "RUNNER_JOB_SIGNING_KEYS=k1:$(openssl rand -hex 32)"
            echo "RUNNER_CALLBACK_KEYS=c1:$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create e2e database
        run: PGPASSWORD=forge psql -h localhost -U forge -d forge_test -c "CREATE DATABASE forge_e2e"
      - run: pnpm build
      - name: Build sandbox images
        run: ./sandboxes/build.sh
      - name: Lint and type-check
        run: pnpm lint && pnpm format:check
      - name: Unit and integration tests
        run: pnpm test
      - name: Validate content packages in real sandboxes
        run: pnpm problems:validate --executor docker
        env:
          RUNNER_RUNTIME: runc
      - name: Install Playwright browser
        run: pnpm --filter @forge/web exec playwright install --with-deps chromium
      - name: End-to-end tests (production build, with performance budgets)
        run: pnpm test:e2e
        env:
          PERF: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dependency audit (fails on high/critical)
        run: pnpm audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
