packages:
  - 'apps/*'
  - 'packages/*'
  - 'content'
allowBuilds:
  argon2: true
  esbuild: true
  prisma: true
  '@prisma/engines': true
  sharp: true
  unrs-resolver: true
  # Optional native speed-up for BullMQ; the pure JS fallback is used instead.
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.2'
  - '@nestjs/core@12.1.2'
  - '@nestjs/platform-express@12.1.2'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - lucide-react@1.49.0
  - vitest@5.0.3
  - nodemailer@10.0.13
  - stripe@23.0.0
