#!/usr/sbin/nft -f
# Runner VM firewall: default deny both ways (docs/runbooks/runner-vm.md §2).
# install.sh fills in the @VARS@ and loads it at boot. Sandboxes also run with --network none.
flush ruleset

table inet forge {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr @ADMIN_CIDR@ tcp dport 22 accept
    icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 5/second accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request } accept
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    # Cloud metadata endpoint: never (no instance credentials on this host).
    ip daddr 169.254.169.254 drop
    udp dport 53 accept
    tcp dport 53 accept
    udp dport 123 accept
    # Job Redis on the app VM's private address.
    ip daddr @JOB_REDIS_IP@ tcp dport @JOB_REDIS_PORT@ accept
    # HTTPS: the API callback, image registry and OS updates.
    tcp dport 443 accept
    icmp type echo-request accept
  }

  chain forward {
    # Sandboxes have no network; nothing is routed through this host.
    type filter hook forward priority 0; policy drop;
  }
}
